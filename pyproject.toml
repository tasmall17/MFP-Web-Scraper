[project]
name = "my-favorite-professor"
version = "0.1.0"
description = "Learn a subject from material you chose yourself, with a Claude that learns how to explain things to you."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    # Capture layer.
    "httpx>=0.28",
    "certifi",
    "beautifulsoup4>=4.13",
    "lxml>=5",
    "pillow>=11",
    "trafilatura>=2.0",
    "markdownify>=0.13",
    "playwright>=1.49",
    # Local-file ingest. pypdf is BSD-3, which keeps this repo's licensing
    # simple -- the obvious alternative (PyMuPDF) is AGPL.
    "pypdf>=5.1",
    # The application itself.
    "anthropic>=0.69",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
# T3 stealth tier for the capture layer. Kept optional so the tool installs and
# works without it; fetch.py degrades to T2 if it's missing.
stealth = ["patchright>=1.49"]

[project.scripts]
my-favorite-professor = "professor.cli:main"
mfp = "professor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["professor"]

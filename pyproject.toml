[project]
name = "mfp-web-scraper"
version = "0.1.0"
description = "Capture a web page, a GitHub tree, or a whole site section as readable Markdown plus a self-contained offline archive."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.28",
    "certifi",
    "beautifulsoup4>=4.13",
    "lxml>=5",
    "pillow>=11",
    "trafilatura>=2.0",
    "markdownify>=0.13",
    "playwright>=1.49",
]

[project.optional-dependencies]
# T3 stealth tier. Optional so the tool installs and works without it;
# fetch.py degrades to T2 if it's missing.
stealth = ["patchright>=1.49"]

[project.scripts]
mfp = "professor.capture.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["professor", "tests"]

# `mfp --man` looks beside the package as well as at the repo root, so the
# manual survives a non-editable install too.
force-include = { "man-mfp.md" = "professor/man-mfp.md" }
